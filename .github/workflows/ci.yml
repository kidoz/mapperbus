name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MESON_VERSION: "1.5.2"

jobs:
  build-test:
    name: build / test (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - os: macos-14
            compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsdl2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev \
            libdecor-0-dev libdbus-1-dev libibus-1.0-dev libpulse-dev \
            libasound2-dev libudev-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson
        run: pip install meson==${MESON_VERSION}

      - name: Configure (no GUI frontend)
        run: meson setup buildDir -Denable_nodalkit_gui=false

      - name: Build
        run: meson compile -C buildDir

      - name: Test
        run: meson test -C buildDir --print-errorlogs --suite=mapperbus

  lint:
    name: format check + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang-format-18 \
            clang-tidy-18 libsdl2-dev libx11-dev libwayland-dev \
            libxkbcommon-dev libdecor-0-dev libdbus-1-dev libasound2-dev \
            libudev-dev
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy \
            /usr/bin/clang-tidy-18 100

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson
        run: pip install meson==${MESON_VERSION}

      - name: clang-format check
        run: |
          find src tests -name '*.hpp' -o -name '*.cpp' \
            | sort | xargs clang-format --dry-run --Werror

      - name: Configure build for compile_commands.json
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup buildDir -Denable_nodalkit_gui=false

      - name: clang-tidy
        run: |
          find src -name '*.cpp' ! -path 'src/frontends/nodalkit/*' | sort | \
            xargs clang-tidy -p buildDir --header-filter='src/.*'

  sanitize:
    name: sanitize (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang-18 \
            libc++-18-dev libc++abi-18-dev libsdl2-dev libx11-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev \
            libasound2-dev libudev-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson
        run: pip install meson==${MESON_VERSION}

      - name: Configure sanitizer build
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          meson setup buildDir-sanitize \
            -Db_sanitize=address,undefined \
            -Db_lto=false \
            -Db_lundef=false \
            -Denable_nodalkit_gui=false

      - name: Build with sanitizers
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson compile -C buildDir-sanitize

      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C buildDir-sanitize --print-errorlogs --suite=mapperbus
